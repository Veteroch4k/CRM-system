databaseChangeLog:
  - changeSet:
      id: create-sellers-table
      author: Veteroch4k
      changes:
        - createTable:
            tableName: sellers
            columns:
              - column:
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
                  name: id
                  type: BIGINT
              - column:
                  constraints:
                    nullable: false
                  name: name
                  type: VARCHAR(50)
              - column:
                  name: contact_info
                  type: TEXT
              - column:
                  constraints:
                    nullable: false
                  name: registration_date
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
